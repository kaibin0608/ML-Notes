<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating hearts background */
    .floating-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: absolute;
      font-size: 20px;
      opacity: 0.15;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0.15; }
      50% { opacity: 0.25; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* ========== SHARED PAGE STYLES ========== */
    .page {
      z-index: 10;
      text-align: center;
      max-width: 500px;
      padding: 20px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .page.hidden {
      opacity: 0;
      transform: scale(0.8);
      pointer-events: none;
      position: absolute;
    }

    .page.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      position: relative;
    }

    /* ========== INTRO PAGE ========== */
    .intro-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 25px;
    }

    .intro-title {
      font-size: 1.8rem;
      color: #880e4f;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .intro-sub {
      font-size: 1.1rem;
      color: #ad1457;
      margin-bottom: 40px;
    }

    /* ========== NAV BUTTONS ========== */
    .nav-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 25px;
    }

    .btn-nav {
      padding: 12px 35px;
      font-size: 1rem;
      border: 2px solid #c2185b;
      border-radius: 50px;
      background: white;
      color: #c2185b;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-nav:hover:not(:disabled) {
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.2);
    }

    .btn-nav.primary {
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.3);
    }

    .btn-nav.primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #ec407a, #d81b60);
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.5);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* ========== QUIZ SECTION ========== */
    .quiz-progress {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      border: 2px solid #c2185b;
      transition: all 0.4s ease;
    }

    .progress-dot.active {
      background: #e91e63;
      transform: scale(1.2);
      box-shadow: 0 0 10px rgba(233, 30, 99, 0.5);
    }

    .progress-dot.correct {
      background: #4caf50;
      border-color: #388e3c;
    }

    .quiz-question {
      font-size: 1.4rem;
      color: #880e4f;
      margin-bottom: 25px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .quiz-option {
      width: 280px;
      padding: 14px 20px;
      font-size: 1.1rem;
      border: 2px solid #e91e63;
      border-radius: 50px;
      background: white;
      color: #880e4f;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .quiz-option:hover:not(:disabled) {
      background: linear-gradient(135deg, #fce4ec, #f8bbd0);
      transform: scale(1.03);
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.2);
    }

    .quiz-option.correct-answer {
      background: linear-gradient(135deg, #4caf50, #66bb6a);
      border-color: #388e3c;
      color: white;
      transform: scale(1.05);
    }

    .quiz-option.wrong-answer {
      background: #ffcdd2;
      border-color: #ef5350;
      animation: shake 0.5s ease;
    }

    .quiz-option:disabled { cursor: default; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    .quiz-feedback {
      margin-top: 20px;
      font-size: 1.1rem;
      min-height: 30px;
      transition: opacity 0.3s;
    }

    .quiz-feedback.wrong { color: #c62828; }
    .quiz-feedback.right { color: #2e7d32; }

    .quiz-number {
      font-size: 0.9rem;
      color: #ad1457;
      margin-bottom: 10px;
      opacity: 0.7;
    }

    /* ========== VALENTINE QUESTION ========== */
    .valentine-title {
      font-size: 2.5rem;
      color: #880e4f;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(136, 14, 79, 0.2);
    }

    .heart-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 30px;
      animation: heartbeat 1.2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.1); }
    }

    .valentine-buttons {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    .btn-yes {
      padding: 16px 50px;
      font-size: 1.4rem;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #e91e63, #c2185b);
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 6px 25px rgba(233, 30, 99, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-yes:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 35px rgba(233, 30, 99, 0.6);
    }

    /* No button — lives outside sections, always fixed */
    #btnNo {
      padding: 12px 35px;
      font-size: 1rem;
      border: 2px solid #c2185b;
      border-radius: 50px;
      background: white;
      color: #c2185b;
      cursor: pointer;
      font-family: 'Georgia', 'Times New Roman', serif;
      font-weight: bold;
      position: fixed;
      z-index: 50;
      display: none;
      transition: left 0.4s ease, top 0.4s ease;
    }

    /* ========== REVEAL SECTION ========== */
    .reveal-section {
      z-index: 10;
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 1s ease, transform 1s ease;
      position: absolute;
      pointer-events: none;
    }

    .reveal-section.show {
      opacity: 1;
      transform: scale(1);
      position: relative;
      pointer-events: auto;
    }

    .reveal-message {
      font-size: 2.2rem;
      color: #880e4f;
      margin-bottom: 20px;
      animation: fadeInUp 1s ease 0.5s both;
    }

    .reveal-sub {
      font-size: 1.2rem;
      color: #ad1457;
      animation: fadeInUp 1s ease 1s both;
      margin-top: 15px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== BEAUTIFUL ROSE ========== */
    .flower-container {
      position: relative;
      width: 260px;
      height: 340px;
      margin: 0 auto 20px;
    }

    /* Soft glow behind the bloom */
    .flower-glow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,105,135,0.35) 0%, rgba(255,105,135,0) 70%);
      animation: glowIn 1.5s ease 2.2s forwards;
      z-index: 0;
    }

    @keyframes glowIn {
      to { transform: translateX(-50%) scale(1); }
    }

    /* Stem */
    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 7px;
      height: 0;
      background: linear-gradient(to top, #1b5e20, #388e3c, #43a047);
      border-radius: 4px;
      transform: translateX(-50%);
      transform-origin: bottom center;
      animation: growStem 1.2s ease 0.3s forwards;
      box-shadow: 1px 0 3px rgba(0,0,0,0.1);
    }

    /* Thorns */
    .thorn {
      position: absolute;
      left: 50%;
      width: 8px;
      height: 3px;
      background: #2e7d32;
      opacity: 0;
      border-radius: 0 3px 3px 0;
    }

    .thorn-1 {
      bottom: 100px;
      transform: translateX(0px) rotate(-20deg) scale(0);
      animation: growThorn 0.3s ease 1.1s forwards;
    }

    .thorn-2 {
      bottom: 60px;
      transform: translateX(-10px) rotate(20deg) scaleX(-1) scale(0);
      animation: growThorn 0.3s ease 1.3s forwards;
    }

    @keyframes growThorn {
      to { opacity: 0.8; transform: translateX(0px) rotate(-20deg) scale(1); }
    }

    .thorn-2 { animation-name: growThornR; }
    @keyframes growThornR {
      to { opacity: 0.8; transform: translateX(-10px) rotate(20deg) scaleX(-1) scale(1); }
    }

    /* Leaves */
    .leaf {
      position: absolute;
      width: 55px;
      height: 26px;
      opacity: 0;
      border-radius: 0 50% 50% 50%;
      z-index: 1;
    }

    .leaf-left {
      bottom: 110px;
      left: 50%;
      background: linear-gradient(135deg, #388e3c, #66bb6a);
      transform: translateX(-45px) rotate(-35deg) scale(0);
      animation: growLeaf 0.6s ease 1s forwards;
      box-shadow: inset -2px -2px 6px rgba(0,0,0,0.1);
    }

    .leaf-right {
      bottom: 70px;
      left: 50%;
      background: linear-gradient(225deg, #388e3c, #66bb6a);
      transform: translateX(0px) rotate(35deg) scaleX(-1) scale(0);
      animation: growLeafR 0.6s ease 1.2s forwards;
      box-shadow: inset 2px -2px 6px rgba(0,0,0,0.1);
    }

    .leaf-top {
      bottom: 145px;
      left: 50%;
      width: 35px;
      height: 18px;
      background: linear-gradient(135deg, #43a047, #81c784);
      transform: translateX(-30px) rotate(-50deg) scale(0);
      animation: growLeafTop 0.6s ease 1.4s forwards;
    }

    /* Leaf veins */
    .leaf::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 15%;
      width: 60%;
      height: 1px;
      background: rgba(27,94,32,0.25);
      transform: translateY(-50%);
    }

    @keyframes growStem { to { height: 180px; } }
    @keyframes growLeaf { to { opacity: 1; transform: translateX(-45px) rotate(-35deg) scale(1); } }
    @keyframes growLeafR { to { opacity: 1; transform: translateX(0px) rotate(35deg) scaleX(-1) scale(1); } }
    @keyframes growLeafTop { to { opacity: 1; transform: translateX(-30px) rotate(-50deg) scale(1); } }

    /* Petals container */
    .petals {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      z-index: 2;
    }

    /* Outer petals — large, deep red */
    .petal-outer {
      position: absolute;
      width: 58px;
      height: 78px;
      border-radius: 50% 50% 45% 45%;
      opacity: 0;
      transform-origin: center bottom;
    }

    .petal-outer:nth-child(1)  { background: linear-gradient(160deg, #c62828, #e53935); top: 5px; left: 50px; animation: bloomP 0.7s ease 1.4s forwards; --r: 5deg; transform: rotate(5deg) scale(0); }
    .petal-outer:nth-child(2)  { background: linear-gradient(200deg, #b71c1c, #e53935); top: 25px; left: 85px; animation: bloomP 0.7s ease 1.55s forwards; --r: 55deg; transform: rotate(55deg) scale(0); }
    .petal-outer:nth-child(3)  { background: linear-gradient(180deg, #c62828, #ef5350); top: 65px; left: 85px; animation: bloomP 0.7s ease 1.7s forwards; --r: 115deg; transform: rotate(115deg) scale(0); }
    .petal-outer:nth-child(4)  { background: linear-gradient(160deg, #b71c1c, #e53935); top: 80px; left: 52px; animation: bloomP 0.7s ease 1.85s forwards; --r: 175deg; transform: rotate(175deg) scale(0); }
    .petal-outer:nth-child(5)  { background: linear-gradient(200deg, #c62828, #ef5350); top: 65px; left: 15px; animation: bloomP 0.7s ease 2.0s forwards; --r: 235deg; transform: rotate(235deg) scale(0); }
    .petal-outer:nth-child(6)  { background: linear-gradient(180deg, #b71c1c, #e53935); top: 25px; left: 10px; animation: bloomP 0.7s ease 2.15s forwards; --r: 305deg; transform: rotate(305deg) scale(0); }

    /* Middle petals — medium, richer pink */
    .petal-mid {
      position: absolute;
      width: 44px;
      height: 62px;
      border-radius: 50% 50% 42% 42%;
      opacity: 0;
      transform-origin: center bottom;
    }

    .petal-mid:nth-child(7)  { background: linear-gradient(170deg, #d81b60, #ec407a); top: 20px; left: 56px; animation: bloomP 0.6s ease 2.3s forwards; --r: 30deg; transform: rotate(30deg) scale(0); }
    .petal-mid:nth-child(8)  { background: linear-gradient(190deg, #c2185b, #f06292); top: 50px; left: 72px; animation: bloomP 0.6s ease 2.4s forwards; --r: 100deg; transform: rotate(100deg) scale(0); }
    .petal-mid:nth-child(9)  { background: linear-gradient(170deg, #d81b60, #ec407a); top: 68px; left: 42px; animation: bloomP 0.6s ease 2.5s forwards; --r: 190deg; transform: rotate(190deg) scale(0); }
    .petal-mid:nth-child(10) { background: linear-gradient(190deg, #c2185b, #f06292); top: 40px; left: 25px; animation: bloomP 0.6s ease 2.6s forwards; --r: 270deg; transform: rotate(270deg) scale(0); }
    .petal-mid:nth-child(11) { background: linear-gradient(170deg, #d81b60, #ec407a); top: 18px; left: 40px; animation: bloomP 0.6s ease 2.7s forwards; --r: 345deg; transform: rotate(345deg) scale(0); }

    /* Inner petals — small, soft pink, curled */
    .petal-inner {
      position: absolute;
      width: 30px;
      height: 42px;
      border-radius: 50% 50% 40% 40%;
      opacity: 0;
      transform-origin: center bottom;
    }

    .petal-inner:nth-child(12) { background: linear-gradient(160deg, #f48fb1, #f8bbd0); top: 35px; left: 58px; animation: bloomP 0.5s ease 2.8s forwards; --r: 20deg; transform: rotate(20deg) scale(0); }
    .petal-inner:nth-child(13) { background: linear-gradient(200deg, #f06292, #f8bbd0); top: 55px; left: 55px; animation: bloomP 0.5s ease 2.9s forwards; --r: 140deg; transform: rotate(140deg) scale(0); }
    .petal-inner:nth-child(14) { background: linear-gradient(160deg, #f48fb1, #fce4ec); top: 48px; left: 38px; animation: bloomP 0.5s ease 3.0s forwards; --r: 250deg; transform: rotate(250deg) scale(0); }

    @keyframes bloomP {
      0%   { opacity: 0; transform: rotate(var(--r)) scale(0); }
      60%  { opacity: 1; transform: rotate(var(--r)) scale(1.08); }
      100% { opacity: 1; transform: rotate(var(--r)) scale(1); }
    }

    /* Rose center — spiral hint */
    .flower-center {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%) scale(0);
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 40% 40%, #f8bbd0, #e91e63, #c2185b);
      border-radius: 50%;
      animation: centerIn 0.5s ease 3.1s forwards;
      z-index: 3;
      box-shadow: inset 0 0 6px rgba(136,14,79,0.3), 0 0 12px rgba(233,30,99,0.2);
    }

    .flower-center::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 5px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle, #fce4ec, transparent);
      opacity: 0.6;
    }

    @keyframes centerIn {
      0%   { transform: translateX(-50%) scale(0) rotate(0deg); }
      60%  { transform: translateX(-50%) scale(1.15) rotate(90deg); }
      100% { transform: translateX(-50%) scale(1) rotate(180deg); }
    }

    /* Sparkles around flower */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      opacity: 0;
      z-index: 4;
      box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
    }

    .sparkle:nth-child(1) { top: 10px; left: 30px; animation: sparkleAnim 1.8s ease 3.2s infinite; }
    .sparkle:nth-child(2) { top: 0px; left: 110px; animation: sparkleAnim 1.8s ease 3.5s infinite; }
    .sparkle:nth-child(3) { top: 60px; left: 145px; animation: sparkleAnim 1.8s ease 3.8s infinite; }
    .sparkle:nth-child(4) { top: 120px; left: 135px; animation: sparkleAnim 1.8s ease 4.0s infinite; }
    .sparkle:nth-child(5) { top: 130px; left: 20px; animation: sparkleAnim 1.8s ease 3.4s infinite; }
    .sparkle:nth-child(6) { top: 50px; left: 5px; animation: sparkleAnim 1.8s ease 3.7s infinite; }
    .sparkle:nth-child(7) { top: -15px; left: 70px; animation: sparkleAnim 1.8s ease 4.1s infinite; }
    .sparkle:nth-child(8) { top: 90px; left: 150px; animation: sparkleAnim 1.8s ease 3.3s infinite; }

    @keyframes sparkleAnim {
      0%, 100% { opacity: 0; transform: scale(0); }
      30% { opacity: 1; transform: scale(1.2); }
      50% { opacity: 0.8; transform: scale(0.8); }
      70% { opacity: 1; transform: scale(1); }
      90% { opacity: 0; transform: scale(0.3); }
    }

    /* Confetti canvas */
    #confettiCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* No button dodge message */
    .no-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.9);
      color: #c2185b;
      padding: 10px 25px;
      border-radius: 25px;
      font-size: 1rem;
      font-family: inherit;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 200;
      white-space: nowrap;
    }

    .no-msg.show { opacity: 1; }

    @media (max-width: 500px) {
      .intro-title { font-size: 1.4rem; }
      .quiz-question { font-size: 1.15rem; }
      .quiz-option { width: 240px; font-size: 1rem; padding: 12px 16px; }
      .valentine-title { font-size: 1.6rem; }
      .btn-yes { padding: 14px 40px; font-size: 1.2rem; }
      .reveal-message { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

  <!-- Floating background hearts -->
  <div class="floating-hearts" id="floatingHearts"></div>

  <!-- ===== PAGE 1: INTRO ===== -->
  <div class="page show" id="introPage">
    <span class="intro-emoji">&#x1F4DD;</span>
    <p class="intro-title">Hi, this is the last quiz you will do for this week, I promise</p>
    <p class="intro-sub">Ready?</p>
    <div class="nav-buttons">
      <button class="btn-nav primary" id="introNext">Next</button>
    </div>
  </div>

  <!-- ===== PAGE 2: QUIZ ===== -->
  <div class="page hidden" id="quizPage">
    <div class="quiz-progress" id="quizProgress"></div>
    <p class="quiz-number" id="quizNumber"></p>
    <div class="quiz-question" id="quizQuestion"></div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="nav-buttons">
      <button class="btn-nav" id="quizBack">Back</button>
      <button class="btn-nav primary" id="quizNext" disabled>Next</button>
    </div>
  </div>

  <!-- ===== PAGE 3: VALENTINE QUESTION ===== -->
  <div class="page hidden" id="valentinePage">
    <span class="heart-emoji">&#x1F495;</span>
    <h1 class="valentine-title">Will you be my Valentine?</h1>
    <div class="valentine-buttons">
      <button class="btn-yes" id="btnYes">Yes!</button>
    </div>
  </div>

  <!-- No button — placed OUTSIDE sections so it can freely move around the screen -->
  <button id="btnNo">No</button>

  <!-- ===== PAGE 4: REVEAL ===== -->
  <div class="reveal-section" id="revealSection">
    <div class="flower-container">
      <!-- Glow behind bloom -->
      <div class="flower-glow"></div>
      <!-- Sparkles -->
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <div class="sparkle"></div>
      <!-- Petals: outer (6) + middle (5) + inner (3) -->
      <div class="petals">
        <div class="petal-outer"></div>
        <div class="petal-outer"></div>
        <div class="petal-outer"></div>
        <div class="petal-outer"></div>
        <div class="petal-outer"></div>
        <div class="petal-outer"></div>
        <div class="petal-mid"></div>
        <div class="petal-mid"></div>
        <div class="petal-mid"></div>
        <div class="petal-mid"></div>
        <div class="petal-mid"></div>
        <div class="petal-inner"></div>
        <div class="petal-inner"></div>
        <div class="petal-inner"></div>
      </div>
      <div class="flower-center"></div>
      <!-- Stem + thorns -->
      <div class="stem"></div>
      <div class="thorn thorn-1"></div>
      <div class="thorn thorn-2"></div>
      <!-- Leaves -->
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
      <div class="leaf leaf-top"></div>
    </div>
    <p class="reveal-message">Yay!! Happy Valentine's Day!</p>
    <p class="reveal-sub">You just made me the happiest person in the world &#x1F496;</p>
  </div>

  <!-- No button dodge message -->
  <div class="no-msg" id="noMsg"></div>

  <!-- Confetti Canvas -->
  <canvas id="confettiCanvas"></canvas>

  <script>
    // =====================
    //  PAGE NAVIGATION
    // =====================
    const introPage = document.getElementById('introPage');
    const quizPage = document.getElementById('quizPage');
    const valentinePage = document.getElementById('valentinePage');
    const revealSection = document.getElementById('revealSection');

    function showPage(toShow, toHide) {
      toHide.forEach(p => { p.classList.remove('show'); p.classList.add('hidden'); });
      setTimeout(() => { toShow.classList.remove('hidden'); toShow.classList.add('show'); }, 300);
    }

    // =====================
    //  QUIZ DATA
    // =====================
    const quizData = [
      {
        question: "When is our anniversary?",
        options: ["10 February", "12 February", "14 February", "22 February"],
        correct: 1,
        wrongMsg: "Hmm... are you really my girlfriend? Try again!",
        rightMsg: "That's right! You remembered!"
      },
      {
        question: "How many Valentine's Days have we shared so far?",
        options: ["1", "2", "3", "4"],
        correct: 2,
        wrongMsg: "Nope~ Someone hasn't been counting! Try again!",
        rightMsg: "Yes! Every single one has been special!"
      },
      {
        question: "What's my favorite dessert?",
        options: ["Tau fu near", "Tau fu super near", "Tau fu far", "Tau fu super far"],
        correct: 2,
        wrongMsg: "You don't know my favorite dessert?! Try again!",
        rightMsg: "You know me so well!"
      },
      {
        question: "Which side of my boobs is larger?",
        options: ["Left", "Right", "Middle", "Both"],
        correct: 0,
        wrongMsg: "Excuse me?? You should know this! Try again!",
        rightMsg: "Okay you definitely know me intimately hehe"
      },
      {
        question: "Just to make sure... are you Yiwei the cutie?",
        options: ["Yes, that's me!", "Who's Yiwei?", "Maybe...", "No"],
        correct: 0,
        wrongMsg: "Wait... then who are you?! Try again!",
        rightMsg: "I knew it was you all along!"
      }
    ];

    let currentQ = 0;
    let locked = false;
    const answered = new Array(quizData.length).fill(false); // track which questions are answered

    const quizProgress = document.getElementById('quizProgress');
    const quizNumber = document.getElementById('quizNumber');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizFeedback = document.getElementById('quizFeedback');
    const quizBack = document.getElementById('quizBack');
    const quizNext = document.getElementById('quizNext');

    // Build progress dots
    quizData.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'progress-dot';
      dot.id = 'dot-' + i;
      quizProgress.appendChild(dot);
    });

    function updateProgressDots() {
      quizData.forEach((_, i) => {
        const dot = document.getElementById('dot-' + i);
        dot.className = 'progress-dot';
        if (answered[i]) dot.classList.add('correct');
        if (i === currentQ) dot.classList.add('active');
      });
    }

    function renderQuestion() {
      const q = quizData[currentQ];
      quizNumber.textContent = 'Question ' + (currentQ + 1) + ' of ' + quizData.length;
      quizQuestion.textContent = q.question;
      quizOptions.innerHTML = '';

      updateProgressDots();

      // If already answered, show completed state
      if (answered[currentQ]) {
        locked = true;
        quizFeedback.textContent = q.rightMsg;
        quizFeedback.className = 'quiz-feedback right';
        quizNext.disabled = false;

        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-option';
          btn.textContent = opt;
          btn.disabled = true;
          if (i === q.correct) btn.classList.add('correct-answer');
          else { btn.style.opacity = '0.5'; }
          quizOptions.appendChild(btn);
        });
      } else {
        locked = false;
        quizFeedback.textContent = '';
        quizFeedback.className = 'quiz-feedback';
        quizNext.disabled = true;

        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'quiz-option';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleAnswer(i, btn));
          quizOptions.appendChild(btn);
        });
      }

      // Back button: goes to intro if on Q1
      quizBack.textContent = currentQ === 0 ? 'Back' : 'Back';
    }

    function handleAnswer(index, btn) {
      if (locked) return;
      const q = quizData[currentQ];

      if (index === q.correct) {
        locked = true;
        answered[currentQ] = true;
        btn.classList.add('correct-answer');
        quizFeedback.textContent = q.rightMsg;
        quizFeedback.className = 'quiz-feedback right';
        quizNext.disabled = false;

        // Disable all buttons
        document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);

        updateProgressDots();
      } else {
        btn.classList.add('wrong-answer');
        quizFeedback.textContent = q.wrongMsg;
        quizFeedback.className = 'quiz-feedback wrong';

        setTimeout(() => {
          btn.classList.remove('wrong-answer');
          btn.style.opacity = '0.5';
          btn.style.pointerEvents = 'none';
        }, 600);
      }
    }

    // --- INTRO -> QUIZ ---
    document.getElementById('introNext').addEventListener('click', () => {
      currentQ = 0;
      showPage(quizPage, [introPage]);
      setTimeout(() => renderQuestion(), 350);
    });

    // --- QUIZ BACK ---
    quizBack.addEventListener('click', () => {
      if (currentQ === 0) {
        showPage(introPage, [quizPage]);
      } else {
        currentQ--;
        renderQuestion();
      }
    });

    // --- QUIZ NEXT ---
    quizNext.addEventListener('click', () => {
      if (currentQ < quizData.length - 1) {
        currentQ++;
        renderQuestion();
      } else {
        // All done — show valentine page
        showPage(valentinePage, [quizPage]);
        setTimeout(showNoButton, 600);
      }
    });

    // =====================
    //  FLOATING HEARTS BG
    // =====================
    const heartsContainer = document.getElementById('floatingHearts');
    const heartChars = ['\u2764', '\uD83D\uDC95', '\uD83D\uDC96', '\uD83D\uDC97', '\u2665'];

    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (14 + Math.random() * 18) + 'px';
      heart.style.animationDuration = (6 + Math.random() * 8) + 's';
      heart.style.animationDelay = (Math.random() * 10) + 's';
      heartsContainer.appendChild(heart);
    }

    // =====================
    //  DODGING NO BUTTON
    // =====================
    const btnNo = document.getElementById('btnNo');
    const noMsg = document.getElementById('noMsg');

    const funnyMessages = [
      "Nope, that's not an option! \uD83D\uDE0F",
      "Try again~ \uD83D\uDE1C",
      "Are you sure about that? \uD83E\uDD14",
      "Wrong answer! \uD83D\uDE02",
      "Hehe, you can't click me! \uD83D\uDE1D",
      "Maybe reconsider? \uD83D\uDC95",
      "That button doesn't work! \uD83D\uDE07"
    ];
    let msgIndex = 0;
    let noMsgTimer = null;

    function showNoButton() {
      // Place it next to the Yes button initially
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      btnNo.style.display = 'block';
      btnNo.style.left = (vw / 2 + 60) + 'px';
      btnNo.style.top = (vh / 2 + 50) + 'px';
      // Disable transition for initial placement
      btnNo.style.transition = 'none';
      // Re-enable transition after a frame
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          btnNo.style.transition = 'left 0.4s ease, top 0.4s ease';
        });
      });
    }

    function dodgeButton() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const btnW = btnNo.offsetWidth;
      const btnH = btnNo.offsetHeight;
      const maxX = vw - btnW - 20;
      const maxY = vh - btnH - 20;
      const newX = 20 + Math.random() * (maxX - 20);
      const newY = 20 + Math.random() * (maxY - 20);

      btnNo.style.left = newX + 'px';
      btnNo.style.top = newY + 'px';

      // Show funny message
      noMsg.textContent = funnyMessages[msgIndex % funnyMessages.length];
      noMsg.classList.add('show');
      msgIndex++;

      clearTimeout(noMsgTimer);
      noMsgTimer = setTimeout(() => noMsg.classList.remove('show'), 1500);
    }

    btnNo.addEventListener('mouseenter', dodgeButton);
    btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); dodgeButton(); });
    btnNo.addEventListener('click', dodgeButton);

    // =====================
    //  YES BUTTON -> REVEAL
    // =====================
    const btnYes = document.getElementById('btnYes');

    btnYes.addEventListener('click', () => {
      // Hide the No button
      btnNo.style.display = 'none';
      noMsg.classList.remove('show');

      // Hide valentine page, show reveal
      showPage(revealSection, [valentinePage]);
      setTimeout(() => {
        revealSection.classList.add('show');
        launchConfetti();
      }, 400);
    });

    // =====================
    //  CONFETTI & HEARTS
    // =====================
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let particles = [];
    let animating = false;

    function launchConfetti() {
      particles = [];
      const colors = ['#e91e63', '#f06292', '#ff4081', '#ff80ab', '#f8bbd0',
                       '#ff1744', '#d50000', '#c2185b', '#ffeb3b', '#ff9800',
                       '#e040fb', '#7c4dff'];

      for (let i = 0; i < 200; i++) {
        const isHeart = Math.random() < 0.35;
        particles.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * canvas.height,
          w: isHeart ? 0 : 6 + Math.random() * 8,
          h: isHeart ? 0 : 4 + Math.random() * 6,
          r: isHeart ? 6 + Math.random() * 8 : 0,
          isHeart,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: 2 + Math.random() * 4,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.15,
          opacity: 1,
          decay: 0.001 + Math.random() * 0.003,
        });
      }

      if (!animating) {
        animating = true;
        animateConfetti();
      }
    }

    function drawHeart(x, y, size, rotation, color, opacity) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.globalAlpha = opacity;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, -size * 0.3);
      ctx.bezierCurveTo(-size * 0.5, -size, -size, -size * 0.4, 0, size * 0.5);
      ctx.moveTo(0, -size * 0.3);
      ctx.bezierCurveTo(size * 0.5, -size, size, -size * 0.4, 0, size * 0.5);
      ctx.fill();
      ctx.restore();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      let alive = 0;
      for (const p of particles) {
        if (p.opacity <= 0) continue;
        alive++;

        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotSpeed;
        p.vy += 0.04;
        p.vx *= 0.999;

        if (p.y > canvas.height * 0.75) {
          p.opacity -= p.decay * 3;
        }

        if (p.isHeart) {
          drawHeart(p.x, p.y, p.r, p.rotation, p.color, p.opacity);
        } else {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
      }

      if (alive > 0) {
        requestAnimationFrame(animateConfetti);
      } else {
        animating = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }
  </script>
</body>
</html>
